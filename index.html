<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#5B4EE8;--primary-light:#EEEDFE;--primary-mid:#AFA9EC;
  --accent:#1D9E75;--accent-light:#E1F5EE;
  --warn:#D85A30;--warn-light:#FAECE7;
  --danger:#E24B4A;--danger-light:#FCEBEB;
  --amber:#BA7517;--amber-light:#FAEEDA;
  --blue:#185FA5;--blue-light:#E6F1FB;
  --gray:#5F5E5A;--gray-light:#F1EFE8;
  --bg:#F8F7FF;--surface:#fff;--border:#E8E6F8;
  --text:#1a1a2e;--text2:#6B6B8A;--text3:#9B9BB5;
  --radius:10px;--radius-lg:14px;--shadow:0 2px 12px rgba(91,78,232,.07);
}
body{font-family:'Sarabun',sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#5B4EE8 0%,#7F77DD 50%,#1D9E75 100%);padding:18px 20px 14px;color:#fff}
.header h1{font-size:20px;font-weight:700;letter-spacing:-.3px}
.header .sub{font-size:12px;opacity:.75;margin-top:2px}
.name-area{margin-top:8px;display:flex;align-items:center;gap:8px}
.name-pill{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 14px;font-size:13px;font-weight:500;cursor:pointer;color:#fff}
.name-pill:hover{background:rgba(255,255,255,.3)}
.name-input-row{display:flex;gap:6px;align-items:center}
.name-input-row input{font-size:13px;padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;width:160px}
.name-input-row input::placeholder{color:rgba(255,255,255,.6)}
.name-input-row button{font-size:12px;padding:4px 12px;border-radius:20px;border:none;background:#fff;color:var(--primary);font-weight:600;cursor:pointer}
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;gap:4px;position:sticky;top:0;z-index:50}
.nav-tab{padding:12px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;font-family:inherit;display:flex;align-items:center;gap:6px}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.nav-tab:hover:not(.active){color:var(--text);background:var(--primary-light);border-radius:var(--radius) var(--radius) 0 0}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block}
.main{padding:18px 16px 40px;max-width:960px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
button{border:1px solid var(--border);border-radius:var(--radius);padding:6px 14px;font-size:13px;font-family:inherit;cursor:pointer;background:var(--surface);color:var(--text)}
button:hover{background:var(--primary-light);border-color:var(--primary-mid);color:var(--primary)}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
button.primary:hover{background:#4a3dd4}
button.danger{color:var(--danger);border-color:#F7C1C1}
button.danger:hover{background:var(--danger-light)}
button.sm{font-size:11px;padding:2px 8px;border-radius:6px}
button.ghost{border:none;background:none;padding:4px 8px;color:var(--text2)}
button.ghost:hover{background:var(--primary-light);color:var(--primary)}
input,select,textarea{border:1.5px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-family:inherit;width:100%;background:var(--surface);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,78,232,.12)}
textarea{resize:vertical}
label.lbl{font-size:12px;color:var(--text2);display:block;margin-bottom:5px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:1/-1}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.stat{border-radius:var(--radius-lg);padding:16px}
.stat .val{font-size:28px;font-weight:700;margin-top:4px}
.stat .lbl{font-size:11px;font-weight:600;opacity:.8}
.section-title{font-size:12px;font-weight:700;color:var(--primary);margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--primary-light);text-transform:uppercase;letter-spacing:.5px}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-hcell{text-align:center;font-size:11px;font-weight:700;padding:7px 2px;border-radius:8px;color:var(--text2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.cal-cell{min-height:88px;border:1.5px solid var(--border);border-radius:10px;padding:5px;cursor:pointer;background:var(--surface);position:relative}
.cal-cell:hover{border-color:var(--primary-mid);background:var(--primary-light)}
.cal-cell.today{background:var(--primary-light);border-color:var(--primary);border-width:2px}
.cal-cell.weekend{background:#FAFAF8}
.cal-cell.holiday{background:#FFF8F0;border-color:#F5D0A9}
.cal-cell.empty{background:transparent;border:none;cursor:default}
.cal-cell.empty:hover{background:transparent;border:none}
.cal-date{font-size:12px;font-weight:700;margin-bottom:3px;color:var(--text)}
.cal-cell.today .cal-date{color:var(--primary)}
.cal-cell.holiday .cal-date{color:var(--warn)}
.day-pill{font-size:9px;padding:2px 5px;border-radius:4px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:14px;font-weight:600}
.holiday-label{font-size:9px;color:var(--warn);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,26,46,.45);z-index:200;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:22px;width:min(540px,95vw);max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(91,78,232,.2)}
.task-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:4px;border:1.5px solid var(--border);background:#FAFAF8}
.task-item.done-item{background:var(--accent-light);border-color:#9FE1CB}
.task-item.done-item .task-text{text-decoration:line-through;color:var(--text3)}
.task-item.rollover{background:#FFF8F0;border-color:#F5D0A9;border-style:dashed}
.task-text{flex:1;font-size:13px;word-break:break-word;padding-top:1px}
.sub-task-item{display:flex;align-items:flex-start;gap:6px;padding:5px 8px;border-radius:6px;margin-bottom:3px;margin-left:24px;border:1px solid var(--border);background:var(--surface)}
.sub-task-item.done-item{background:var(--accent-light);border-color:#9FE1CB}
.sub-task-item.done-item .task-text{text-decoration:line-through;color:var(--text3)}
.add-sub-row{margin-left:24px;display:flex;gap:6px;margin-bottom:4px;margin-top:4px}
.note-section{margin-bottom:12px}
.note-section-label{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:5px}
.alert-row{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px;flex-wrap:wrap;background:var(--surface)}
.export-area{display:flex;gap:8px;align-items:center}
#toast-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(91,78,232,.35);z-index:999;display:none;white-space:nowrap}
.rollover-banner{background:var(--amber-light);border:1px solid #FAC775;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--amber);display:flex;align-items:center;gap:8px;font-weight:500}
.camp-card-dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.date-chip{background:var(--bg);border-radius:8px;padding:8px 10px;border:1px solid var(--border)}
.date-chip .lbl{font-size:10px;color:var(--text2);margin-bottom:3px;font-weight:600;text-transform:uppercase}
.date-chip .val{font-weight:600;font-size:12px}
</style>
</head>

<script type="module">

  {key:"artwork",label:"ส่งไฟล์",ref:"start",color:"#D85A30",bg:"#FAECE7",tc:"#993C1D"},
  {key:"renewal",label:"ต่อสัญญา",days:60,ref:"end",color:"#185FA5",bg:"#E6F1FB",tc:"#0C447C"},
  {key:"campaign_start",label:"ขึ้นสื่อ",days:0,ref:"start",color:"#534AB7",bg:"#EEEDFE",tc:"#3C3489"},
  {key:"campaign_end",label:"หมดอายุ",days:0,ref:"end",color:"#5F5E5A",bg:"#F1EFE8",tc:"#444441"}
];
var PLANB_HOLIDAYS={
  "2026-01-01":"วันขึ้นปีใหม่","2026-03-03":"วันมาฆบูชา",
  "2026-04-13":"วันสงกรานต์","2026-04-14":"วันสงกรานต์","2026-04-15":"วันสงกรานต์",
  "2026-05-01":"วันแรงงาน","2026-06-03":"วันเฉลิมพระชนมพรรษา ร.10",
  "2026-07-28":"วันเฉลิมพระชนมพรรษา ร.10","2026-07-29":"วันอาสาฬหบูชา",
  "2026-08-12":"วันแม่แห่งชาติ","2026-10-13":"วันนวมินทรมหาราช",
  "2026-10-23":"วันปิยมหาราช","2026-12-07":"ชดเชยวันพ่อ",
  "2026-12-10":"วันรัฐธรรมนูญ","2026-12-30":"วันสิ้นปี","2026-12-31":"วันสิ้นปี"
};

var campaigns=JSON.parse(localStorage.getItem(SK)||"[]");
var wpData=JSON.parse(localStorage.getItem(WK)||"{}");
var overrides=JSON.parse(localStorage.getItem(OK)||"{}");
var salesName=localStorage.getItem(NK)||"";
var wpMonth=new Date().getMonth(), wpYear=new Date().getFullYear();
var alertFilter="all", editId=null, showDone=false;
var rolledOverDates=[];
var formMediaItems=[];

function setStatus(msg,timeout){
  var t=document.getElementById("toast-bar");
  t.textContent=msg; t.style.display=msg?"block":"none";
  if(timeout)setTimeout(function(){t.style.display="none";},timeout);
}
function showToast(msg){
  var t=document.getElementById("toast-bar");
  t.textContent=msg; t.style.display="block";
  setTimeout(function(){t.style.display="none";},2000);
}
function updateExportBtns(){
  var s=campaigns.length?"":"none";
  document.getElementById("btn-export-csv").style.display=s;
  document.getElementById("btn-export-xlsx").style.display=s;
}
function saveToFirebase(){
  setDoc(doc(db,"data","main"),{campaigns:campaigns,wpData:wpData,overrides:overrides,salesName:salesName})
    .catch(function(e){console.error("FB save:",e);setStatus("⚠️ Cloud บันทึกไม่สำเร็จ",3000);});
}
function save(){
  localStorage.setItem(SK,JSON.stringify(campaigns));
  localStorage.setItem(WK,JSON.stringify(wpData));
  localStorage.setItem(OK,JSON.stringify(overrides));
  localStorage.setItem(NK,salesName);
  saveToFirebase();
  showToast("☁️ บันทึกแล้ว");
  updateExportBtns();
}
function getHoliday(ds){return PLANB_HOLIDAYS[ds]||null;}
function isWorkday(ds){var d=new Date(ds);var w=d.getDay();return w!==0&&w!==6&&!PLANB_HOLIDAYS[ds];}
function subtractWorkdays(ds,n){
  if(!ds||!n)return ds;
  var d=new Date(ds); var c=0;
  while(c<n){d.setDate(d.getDate()-1);if(isWorkday(d.toISOString().split("T")[0]))c++;}
  return d.toISOString().split("T")[0];
}
function daysUntil(ds){
  if(!ds)return null;
  var t=new Date();t.setHours(0,0,0,0);
  var d=new Date(ds);d.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function addDays(ds,n){if(!ds)return "";var d=new Date(ds);d.setDate(d.getDate()+n);return d.toISOString().split("T")[0];}
function fmtDate(ds){if(!ds)return "—";return new Date(ds).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"});}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayKey(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function defaultLead(mt){return mt==="Digital"?7:14;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function urgTag(days){
  if(days===null)return "";
  if(days<0)return '<span class="pill" style="background:#FCEBEB;color:#A32D2D">เลย '+Math.abs(days)+' วัน</span>';
  if(days===0)return '<span class="pill" style="background:#FAECE7;color:#993C1D">วันนี้</span>';
  if(days<=7)return '<span class="pill" style="background:#FAECE7;color:#993C1D">อีก '+days+' วัน</span>';
  if(days<=14)return '<span class="pill" style="background:#FAEEDA;color:#854F0B">อีก '+days+' วัน</span>';
  return '<span class="pill" style="background:#EAF3DE;color:#3B6D11">อีก '+days+' วัน</span>';
}
function getAlertDate(c,rule){
  var ok=c.id+"_"+rule.key;
  if(overrides[ok])return overrides[ok];
  if(rule.key==="artwork")return subtractWorkdays(c.start_date,parseInt(c.artwork_lead||defaultLead(c.media_type)));
  if(rule.ref==="start")return rule.days===0?c.start_date:addDays(c.start_date,-rule.days);
  if(rule.ref==="end")return rule.days===0?c.end_date:addDays(c.end_date,-rule.days);
  return "";
}
function getAlerts(includeDone){
  var arr=[];
  campaigns.forEach(function(c){
    ALERT_RULES.forEach(function(rule){
      var ad=getAlertDate(c,rule);
      if(!ad)return;
      if(!includeDone){
        var st=(c.statuses||{})[rule.key]||"Pending";
        if(st==="Done"||st==="N/A")return;
      }
      arr.push({campId:c.id,client:c.client,media_type:c.media_type,rule:rule,alertDate:ad,days:daysUntil(ad)});
    });
  });
  arr.sort(function(a,b){return (a.days==null?999:a.days)-(b.days==null?999:b.days);});
  return arr;
}

function rolloverPendingTasks(){
  var td=todayStr();
  rolledOverDates=[];
  var changed=false;
  Object.keys(wpData).forEach(function(ds){
    if(!wpData[ds]||!wpData[ds].tasks)return;
    wpData[ds].tasks.forEach(function(t){
      if(!t.originId){t.originId=t.rolledFrom||t.id;changed=true;}
    });
  });
  var doneOrigins={};
  Object.keys(wpData).forEach(function(ds){
    if(!wpData[ds]||!wpData[ds].tasks)return;
    wpData[ds].tasks.forEach(function(t){if(t.done)doneOrigins[t.originId]=true;});
  });
  var todayOrigins={};
  if(wpData[td]&&wpData[td].tasks){
    wpData[td].tasks.forEach(function(t){todayOrigins[t.originId]=true;});
  }
  Object.keys(wpData).forEach(function(ds){
    if(ds>=td)return;
    var dd=wpData[ds];
    if(!dd||!dd.tasks)return;
    var pending=dd.tasks.filter(function(t){
      return !t.done && !doneOrigins[t.originId] && !todayOrigins[t.originId];
    });
    if(!pending.length)return;
    if(!wpData[td])wpData[td]={tasks:[],notes:{}};
    pending.forEach(function(t){
      wpData[td].tasks.push({
        text:t.text,
        subs:t.subs?JSON.parse(JSON.stringify(t.subs)):[],
        id:Date.now().toString()+Math.random().toString(36).slice(2),
        originId:t.originId,
        rolledFrom:t.originId,
        rolledFromDate:ds,
        done:false
      });
      todayOrigins[t.originId]=true;
      changed=true;
    });
    rolledOverDates.push({date:ds,count:pending.length});
  });
  if(changed){
    localStorage.setItem(WK,JSON.stringify(wpData));
    saveToFirebase();
  }
}

function switchTab(name){
  document.querySelectorAll(".nav-tab").forEach(function(t){
    t.classList.toggle("active",t.getAttribute("data-tab")===name);
  });
  ["workplan","dashboard","campaigns","alerts"].forEach(function(p){
    document.getElementById("page-"+p).style.display=p===name?"block":"none";
  });
  renderTab(name);
}
function renderAll(){["workplan","dashboard","campaigns","alerts"].forEach(renderTab);}
function renderTab(n){
  if(n==="workplan")renderWorkplan();
  else if(n==="dashboard")renderDashboard();
  else if(n==="campaigns")renderCampaigns();
  else if(n==="alerts")renderAlerts();
}

function getDayAlerts(ds){
  var arr=[];
  campaigns.forEach(function(c){
    ALERT_RULES.forEach(function(rule){
      if(getAlertDate(c,rule)!==ds)return;
      var st=(c.statuses||{})[rule.key]||"Pending";
      if(st==="Done"||st==="N/A")return;
      arr.push({client:c.client,rule:rule,campId:c.id});
    });
  });
  return arr;
}
function renderWorkplan(){
  var el=document.getElementById("page-workplan");
  var td=new Date();td.setHours(0,0,0,0);
  var dim=new Date(wpYear,wpMonth+1,0).getDate();
  var first=new Date(wpYear,wpMonth,1).getDay();
  var prefix=wpYear+"-"+String(wpMonth+1).padStart(2,"0");
  var noteCnt=0,tot=0,done=0;
  Object.keys(wpData).forEach(function(k){
    var d=wpData[k];
    if(!d)return;
    if(k.indexOf(prefix)===0&&d.notes&&(d.notes.meeting||d.notes.followup||d.notes.remark))noteCnt++;
    (d.tasks||[]).forEach(function(t){tot++;if(t.done)done++;});
  });
  var hdr="";
  DAYS_TH.forEach(function(d,i){
    var we=i===0||i===6;
    hdr+='<div class="cal-hcell" style="background:'+(we?"#f5f5f3":"var(--primary-light)")+';color:'+(we?"var(--text3)":"var(--primary)")+'">'+d+'</div>';
  });
  var cells="";
  for(var i=0;i<first;i++)cells+='<div class="cal-cell empty"></div>';
  for(var d=1;d<=dim;d++){
    var ds=dayKey(wpYear,wpMonth,d);
    var dt=new Date(wpYear,wpMonth,d);dt.setHours(0,0,0,0);
    var isToday=dt.getTime()===td.getTime();
    var dow=dt.getDay(), isWE=dow===0||dow===6;
    var hol=getHoliday(ds);
    var dd=wpData[ds]||{tasks:[],notes:{}};
    var tasks=dd.tasks||[];
    var dc=tasks.filter(function(t){return t.done;}).length;
    var rolledCnt=tasks.filter(function(t){return t.rolledFrom&&!t.done;}).length;
    var dayAlerts=getDayAlerts(ds);
    var hasNote=dd.notes&&(dd.notes.meeting||dd.notes.followup||dd.notes.remark);
    var cls="cal-cell"+(isToday?" today":hol?" holiday":isWE?" weekend":"");
    var inner='<div class="cal-date">'+d+'</div>';
    if(hol)inner+='<div class="holiday-label">🎌 '+esc(hol)+'</div>';
    dayAlerts.slice(0,2).forEach(function(a){
      inner+='<div class="day-pill" style="background:'+a.rule.bg+';color:'+a.rule.tc+'">'+a.rule.label+' '+esc(a.client.split(" ")[0])+'</div>';
    });
    if(dayAlerts.length>2)inner+='<div style="font-size:9px;color:var(--text3)">+'+(dayAlerts.length-2)+'</div>';
    if(tasks.length>0)inner+='<div style="font-size:9px;color:'+(dc===tasks.length?"var(--accent)":"var(--text2)")+';font-weight:600">✓ '+dc+'/'+tasks.length+'</div>';
    if(rolledCnt>0)inner+='<div style="font-size:9px;color:var(--amber);font-weight:600">↩ '+rolledCnt+' เลื่อน</div>';
    if(hasNote)inner+='<div style="font-size:9px;color:var(--primary)">📋 โน้ต</div>';
    cells+='<div class="'+cls+'" data-day="'+ds+'">'+inner+'</div>';
  }
  var legend="";
  ALERT_RULES.forEach(function(r){
    legend+='<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:'+r.tc+';margin-right:10px"><span style="width:8px;height:8px;border-radius:3px;background:'+r.bg+';border:1px solid '+r.color+';display:inline-block"></span>'+r.label+'</span>';
  });
  el.innerHTML=
    '<div class="flex-between" style="margin-bottom:14px;flex-wrap:wrap;gap:8px">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<button class="ghost" id="wp-prev">‹</button>'+
        '<div style="font-size:16px;font-weight:700;min-width:150px;text-align:center;color:var(--primary)">'+MONTHS_TH[wpMonth]+' '+(wpYear+543)+'</div>'+
        '<button class="ghost" id="wp-next">›</button>'+
      '</div>'+
      '<span style="font-size:12px;color:var(--text2)">งานเดือนนี้: <b style="color:var(--accent)">'+done+'/'+tot+'</b> | โน้ต: <b style="color:var(--primary)">'+noteCnt+'</b></span>'+
    '</div>'+
    '<div class="cal-header">'+hdr+'</div>'+
    '<div class="cal-grid">'+cells+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">'+legend+
      '<span style="font-size:11px;color:var(--warn);margin-left:8px">🎌 วันหยุด Plan B</span>'+
      '<span style="font-size:11px;color:var(--amber);margin-left:8px">↩ task เลื่อนมา</span>'+
    '</div>';
  document.getElementById("wp-prev").onclick=function(){if(wpMonth===0){wpMonth=11;wpYear--;}else wpMonth--;renderWorkplan();};
  document.getElementById("wp-next").onclick=function(){if(wpMonth===11){wpMonth=0;wpYear++;}else wpMonth++;renderWorkplan();};
  el.querySelectorAll(".cal-cell[data-day]").forEach(function(c){
    c.onclick=function(){openDayModal(c.getAttribute("data-day"));};
  });
}

function renderTaskList(ds){
  var el=document.getElementById("task-list");
  if(!el)return;
  ensureDay(ds);
  var tasks=wpData[ds].tasks;
  var html="";
  tasks.forEach(function(t){
    var isRolled=!!t.rolledFrom;
    var subsHTML="";
    (t.subs||[]).forEach(function(s){
      subsHTML+='<div class="sub-task-item '+(s.done?"done-item":"")+'">'+
        '<input type="checkbox" '+(s.done?"checked":"")+' data-act="togsub" data-tid="'+t.id+'" data-sid="'+s.id+'" style="width:14px;height:14px;cursor:pointer;margin-top:2px;accent-color:var(--accent)">'+
        (s.editing?'<input class="edit-sub-inp" data-tid="'+t.id+'" data-sid="'+s.id+'" value="'+esc(s.text)+'" style="flex:1;font-size:12px">':'<span class="task-text">'+esc(s.text)+'</span>')+
        '<button class="sm ghost" data-act="editsub" data-tid="'+t.id+'" data-sid="'+s.id+'" style="font-size:10px">✏️</button>'+
        '<button class="sm danger" data-act="delsub" data-tid="'+t.id+'" data-sid="'+s.id+'">✕</button>'+
      '</div>';
    });
    html+='<div class="task-item '+(t.done?"done-item":"")+' '+(isRolled&&!t.done?"rollover":"")+'">'+
      '<input type="checkbox" '+(t.done?"checked":"")+' data-act="togtask" data-tid="'+t.id+'" style="width:15px;height:15px;cursor:pointer;margin-top:2px;accent-color:var(--accent)">'+
      '<div style="flex:1">'+
        (t.editing?'<input class="edit-task-inp" data-tid="'+t.id+'" value="'+esc(t.text)+'" style="width:100%;font-size:13px;margin-bottom:4px">':'<span class="task-text">'+(isRolled&&!t.done?'<span style="font-size:10px;background:var(--amber-light);color:var(--amber);border-radius:4px;padding:1px 5px;margin-right:4px;font-weight:600">↩ เลื่อนมา</span>':'')+esc(t.text)+'</span>')+
        '<div>'+subsHTML+'</div>'+
        '<div class="add-sub-row"><input class="sub-input" data-tid="'+t.id+'" placeholder="เพิ่ม sub-task..." style="flex:1;font-size:12px"><button class="sm" data-act="addsub" data-tid="'+t.id+'">+ Sub</button></div>'+
      '</div>'+
      '<button class="sm ghost" data-act="edittask" data-tid="'+t.id+'" style="font-size:10px">✏️</button>'+
      '<button class="sm danger" data-act="deltask" data-tid="'+t.id+'">✕</button>'+
    '</div>';
  });
  el.innerHTML=html;
  el.querySelectorAll('[data-act]').forEach(function(elm){
    var act=elm.getAttribute("data-act");
    var tid=elm.getAttribute("data-tid");
    var sid=elm.getAttribute("data-sid");
    if(act==="togtask")elm.onchange=function(){toggleTask(ds,tid);};
    else if(act==="deltask")elm.onclick=function(){deleteTask(ds,tid);};
    else if(act==="edittask")elm.onclick=function(){startEditTask(ds,tid);};
    else if(act==="addsub")elm.onclick=function(){addSub(ds,tid);};
    else if(act==="togsub")elm.onchange=function(){toggleSub(ds,tid,sid);};
    else if(act==="delsub")elm.onclick=function(){deleteSub(ds,tid,sid);};
    else if(act==="editsub")elm.onclick=function(){startEditSub(ds,tid,sid);};
  });
  el.querySelectorAll('.sub-input').forEach(function(inp){

  });

    var tid=inp.getAttribute("data-tid");

    inp.addEventListener("blur",function(){saveEditTask(ds,tid);});
  });
  el.querySelectorAll('.edit-sub-inp').forEach(function(inp){
    var tid=inp.getAttribute("data-tid"),sid=inp.getAttribute("data-sid");
    inp.focus();
    inp.addEventListener("keydown",function(e){if(e.key==="Enter")saveEditSub(ds,tid,sid);});
    inp.addEventListener("blur",function(){saveEditSub(ds,tid,sid);});
  });
}
function addTask(ds){
  var i=document.getElementById("task-input");
  if(!i||!i.value.trim())return;
  ensureDay(ds);
  var id=Date.now().toString()+Math.random().toString(36).slice(2);
  wpData[ds].tasks.push({id:id,originId:id,text:i.value.trim(),done:false,subs:[]});
  i.value="";
  save();renderTaskList(ds);
}
function toggleTask(ds,tid){
  ensureDay(ds);
  var target=wpData[ds].tasks.filter(function(t){return t.id===tid;})[0];
  if(!target)return;
  var newState=!target.done;
  var originId=target.originId||target.rolledFrom||target.id;
  Object.keys(wpData).forEach(function(key){
    if(!wpData[key]||!wpData[key].tasks)return;
    wpData[key].tasks.forEach(function(t){
      var o=t.originId||t.rolledFrom||t.id;
      if(o===originId)t.done=newState;
    });
  });
  save();renderTaskList(ds);renderWorkplan();
}
function deleteTask(ds,tid){
  ensureDay(ds);
  wpData[ds].tasks=wpData[ds].tasks.filter(function(t){return t.id!==tid;});
  save();renderTaskList(ds);
}
function startEditTask(ds,tid){
  ensureDay(ds);
  wpData[ds].tasks.forEach(function(t){if(t.id===tid)t.editing=true;});
  renderTaskList(ds);
}
function saveEditTask(ds,tid){
  var inp=document.querySelector('.edit-task-inp[data-tid="'+tid+'"]');
  if(!inp)return;
  var v=inp.value.trim();
  if(!v){wpData[ds].tasks.forEach(function(t){if(t.id===tid)t.editing=false;});renderTaskList(ds);return;}
  wpData[ds].tasks.forEach(function(t){if(t.id===tid){t.text=v;t.editing=false;}});
  save();renderTaskList(ds);
}
function addSub(ds,tid){
  var inp=document.querySelector('.sub-input[data-tid="'+tid+'"]');
  if(!inp||!inp.value.trim())return;
  ensureDay(ds);
  wpData[ds].tasks.forEach(function(t){
    if(t.id!==tid)return;
    if(!t.subs)t.subs=[];
    t.subs.push({id:Date.now().toString()+Math.random().toString(36).slice(2),text:inp.value.trim(),done:false});
  });
  save();renderTaskList(ds);
}
function toggleSub(ds,tid,sid){
  ensureDay(ds);
  wpData[ds].tasks.forEach(function(t){
    if(t.id!==tid)return;
    (t.subs||[]).forEach(function(s){if(s.id===sid)s.done=!s.done;});
  });
  save();renderTaskList(ds);
}
function deleteSub(ds,tid,sid){
  ensureDay(ds);
  wpData[ds].tasks.forEach(function(t){
    if(t.id!==tid)return;
    t.subs=(t.subs||[]).filter(function(s){return s.id!==sid;});
  });
  save();renderTaskList(ds);
}
function startEditSub(ds,tid,sid){
  ensureDay(ds);
  wpData[ds].tasks.forEach(function(t){
    if(t.id!==tid)return;
    (t.subs||[]).forEach(function(s){if(s.id===sid)s.editing=true;});
  });
  renderTaskList(ds);
}
function saveEditSub(ds,tid,sid){
  var inp=document.querySelector('.edit-sub-inp[data-tid="'+tid+'"][data-sid="'+sid+'"]');
  if(!inp)return;
  var v=inp.value.trim();
  wpData[ds].tasks.forEach(function(t){
    if(t.id!==tid)return;
    (t.subs||[]).forEach(function(s){if(s.id===sid){if(v)s.text=v;s.editing=false;}});
  });
  save();renderTaskList(ds);
}
function saveDayModal(ds){
  ensureDay(ds);
  NOTE_SECTIONS.forEach(function(s){
    var el=document.getElementById("note-"+s.key);
    if(el)wpData[ds].notes[s.key]=el.value;
  });
  save();renderWorkplan();
  document.getElementById("day-modal-bg").classList.remove("show");
}
function closeDayModalBackdrop(){

      if(el)wpData[ds].notes[s.key]=el.value;
    });

  }
  bg.classList.remove("show");
}

function bindAlertRows(containerId){
  var container=document.getElementById(containerId);
  if(!container)return;
  container.querySelectorAll(".alert-row").forEach(function(row){
    var campId=row.getAttribute("data-camp");
    var ruleKey=row.getAttribute("data-rule");
    var dateInp=row.querySelector(".ovr-date");
    if(dateInp)dateInp.onchange=function(){saveOverride(campId,ruleKey,dateInp.value);};
    var reset=row.querySelector(".ovr-reset");
    if(reset)reset.onclick=function(){saveOverride(campId,ruleKey,"");};
    var mail=row.querySelector(".alert-mail");
    if(mail)mail.onclick=function(){sendAlertEmail(campId,ruleKey);};
    var sel=row.querySelector(".alert-status");
    if(sel)sel.onchange=function(){updateStatus(campId,ruleKey,sel.value);};
  });
}
function updateStatus(campId,key,val){
  campaigns.forEach(function(c){
    if(c.id===campId){if(!c.statuses)c.statuses={};c.statuses[key]=val;}
  });
  save();renderAll();
}
function saveOverride(campId,rk,val){
  var k=campId+"_"+rk;
  if(val)overrides[k]=val;else delete overrides[k];
  save();renderAll();
}
function sendAlertEmail(campId,rk){
  var c=campaigns.filter(function(x){return x.id===campId;})[0];
  if(!c)return;
  var rule=ALERT_RULES.filter(function(r){return r.key===rk;})[0];
  var ad=getAlertDate(c,rule);
  var days=daysUntil(ad);
  var urg=days<0?("เลยกำหนด "+Math.abs(days)+" วัน"):days===0?"วันนี้":("อีก "+days+" วัน");
  var sub=encodeURIComponent("[แจ้งเตือน OOH] "+rule.label+" — "+c.client);
  var body=encodeURIComponent(
    "แจ้งเตือน: "+rule.label+"\n"+
    "ลูกค้า: "+c.client+"\n"+
    "ประเภทสื่อ: "+c.media_type+"\n"+
    (c.quotation?"เลขใบเสนอราคา: "+c.quotation+"\n":"")+
    "วันดำเนินการ: "+fmtDate(ad)+" ("+urg+")\n"+
    (c.start_date?"Ads On: "+fmtDate(c.start_date)+"\n":"")+
    (c.end_date?"หมดอายุ: "+fmtDate(c.end_date)+"\n":"")+
    (c.budget?"งบ: "+Number(c.budget).toLocaleString("th-TH")+" บาท\n":"")+
    (c.notes?"หมายเหตุ: "+c.notes+"\n":"")+
    "\n— OOH Sales Planner Plan B Media"
  );
  window.location.href="mailto:?subject="+sub+"&body="+body;
}

function saveCamp(){
  var client=document.getElementById("f-client").value.trim();
  if(!client){alert("กรุณากรอกชื่อลูกค้า");return;}
  var existing=editId?(campaigns.filter(function(c){return c.id===editId;})[0]||{}):{};
  var obj={
    id:editId||(Date.now().toString()+Math.random().toString(36).slice(2)),
    client:client,
    media_type:document.getElementById("f-media").value,
    media_items:formMediaItems.slice(),
    budget:document.getElementById("f-budget").value,
    quotation:document.getElementById("f-quotation").value,
    start_date:document.getElementById("f-start").value,
    end_date:document.getElementById("f-end").value,
    artwork_lead:document.getElementById("f-lead").value||"14",
    notes:document.getElementById("f-notes").value,
    statuses:existing.statuses||{}
  };
  if(editId){
    campaigns=campaigns.map(function(c){return c.id===editId?obj:c;});
  } else {
    campaigns.push(obj);
  }
  editId=null;
  formMediaItems=[];
  save();renderAll();
}

  else if(alertFilter==="upcoming")filtered=src.filter(function(a){return a.days!==null&&a.days>7&&a.days<=30;});
  else if(alertFilter!=="all")filtered=src.filter(function(a){return a.rule.key===alertFilter;});
  var btns=[["all","ทั้งหมด"],["urgent","เร่งด่วน"],["upcoming","ใกล้ถึง"],["artwork","ส่งไฟล์"],["renewal","ต่อสัญญา"]];

  });

function exportCSV(){
  var h=["ชื่อลูกค้า","ประเภทสื่อ","งบประมาณ","เลขใบเสนอราคา","วันขึ้นสื่อ","วันหมดอายุ","Lead Time","deadline ส่งไฟล์","deadline ต่อสัญญา","หมายเหตุ"];
  var rows=campaigns.map(function(c){

  });
  var all=[h].concat(rows);
  var csv="\uFEFF"+all.map(function(r){
    return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(",");
  }).join("\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="planb.csv";a.click();
  URL.revokeObjectURL(url);
  showToast("ดาวน์โหลด CSV แล้ว!");
}

  var rows2=alerts.map(function(a){
    var dtxt=a.days===null?"":a.days<0?("เลย "+Math.abs(a.days)+" วัน"):a.days===0?"วันนี้":("อีก "+a.days+" วัน");
    var st=((campaigns.filter(function(c){return c.id===a.campId;})[0]||{}).statuses||{})[a.rule.key]||"Pending";
    return [a.client,a.media_type,a.rule.label,a.alertDate||"",dtxt,st];
  });
  var ws2=XLSX.utils.aoa_to_sheet([h2].concat(rows2));
  ws2["!cols"]=[{wch:25},{wch:12},{wch:14},{wch:14},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws2,"แจ้งเตือน");
  var h3=["วันที่","สรุปประชุม","Follow-up","ข้อสังเกต","Task ทั้งหมด","เสร็จ"];
  var rows3=[];
  Object.keys(wpData).sort().forEach(function(ds){
    var d=wpData[ds];
    if(!d)return;
    var t=d.tasks||[];
    var n=d.notes||{};
    if(n.meeting||n.followup||n.remark||t.length>0){
      rows3.push([ds,n.meeting||"",n.followup||"",n.remark||"",t.length,t.filter(function(x){return x.done;}).length]);
    }
  });
  var ws3=XLSX.utils.aoa_to_sheet([h3].concat(rows3));
  ws3["!cols"]=[{wch:14},{wch:35},{wch:35},{wch:35},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws3,"Work Plan");
  XLSX.writeFile(wb,"PlanB_"+new Date().toISOString().slice(0,10)+".xlsx");
  showToast("ดาวน์โหลด Excel แล้ว!");
}

var firstRenderDone=false;
function doFirstRender(){
  if(firstRenderDone)return;
  firstRenderDone=true;
  updateExportBtns();
  renderNameDisplay();
  rolloverPendingTasks();
  renderAll();
}
function loadFromFirebase(){
  setStatus("⏳ กำลังโหลด...");
  // fallback: ถ้า Firebase ไม่ตอบใน 4 วินาที render ด้วยข้อมูลในเครื่องก่อน
  var fallbackTimer=setTimeout(function(){
    setStatus("");
    doFirstRender();
  },4000);
  getDoc(doc(db,"data","main")).then(function(snap){
    clearTimeout(fallbackTimer);
    if(snap.exists()){
      var d=snap.data();
      if(d.campaigns){campaigns=d.campaigns;localStorage.setItem(SK,JSON.stringify(campaigns));}
      if(d.wpData){wpData=d.wpData;localStorage.setItem(WK,JSON.stringify(wpData));}
      if(d.overrides){overrides=d.overrides;localStorage.setItem(OK,JSON.stringify(overrides));}
      if(d.salesName){salesName=d.salesName;localStorage.setItem(NK,salesName);}
    }
    setStatus("");
    firstRenderDone=false;
    doFirstRender();
  }).catch(function(e){
    clearTimeout(fallbackTimer);
    console.error("FB load:",e);
    setStatus("⚠️ โหลด cloud ไม่สำเร็จ ใช้ข้อมูลในเครื่อง",3000);
    doFirstRender();
  });
}

// render ทันทีด้วยข้อมูลในเครื่อง ไม่ต้องรอ Firebase
document.querySelectorAll(".nav-tab").forEach(function(tab){
  tab.onclick=function(){switchTab(tab.getAttribute("data-tab"));};
});
document.getElementById("btn-export-csv").onclick=exportCSV;
document.getElementById("btn-export-xlsx").onclick=exportXLSX;
document.getElementById("day-modal-bg").onclick=function(e){
  if(e.target===document.getElementById("day-modal-bg"))closeDayModalBackdrop();
};
doFirstRender();
loadFromFirebase();
</script>
